name: Deploy Logo Studio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "logo-studio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}logo-studio/
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/logo-studio
          cp -r logo-studio/. _site/logo-studio/
          # root of the Pages site sends visitors straight to the studio
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>OTAGA UI</title>
          <meta http-equiv="refresh" content="0; url=logo-studio/">
          <a href="logo-studio/">Open Logo Studio</a>
          HTML
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
